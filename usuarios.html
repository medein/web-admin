<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios y admins - Panel de Administración</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; }
        .sidebar { min-height: 100vh; background-color: #1e293b; color: white; }
        .nav-link { cursor: pointer; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Menú Lateral Sidebar con IDs corregidos -->
        <div class="col-md-2 sidebar p-3">
            <h4 class="text-success text-center mb-4"><i class="fa-solid fa-futbol me-2"></i>Admin Canchas</h4>
            <hr>
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item mb-2">
                    <a href="index.html" class="nav-link text-white"><i class="fa-solid fa-chart-line me-2"></i> Dashboard</a>
                </li>
                <li class="nav-item mb-2" id="menuComplejos">
                    <a href="complejos.html" class="nav-link text-white"><i class="fa-solid fa-building me-2"></i> Complejos</a>
                </li>
                <li class="nav-item mb-2">
                    <a href="canchas.html" class="nav-link text-white"><i class="fa-solid fa-list me-2"></i> Canchas</a>
                </li>
                <li class="nav-item mb-2">
                    <a href="reservas.html" class="nav-link text-white"><i class="fa-solid fa-calendar-check me-2"></i> Reservas</a>
                </li>
                <li class="nav-item mb-2" id="menuUsuarios">
                    <a href="usuarios.html" class="nav-link active bg-success text-white"><i class="fa-solid fa-users-gear me-2"></i> Usuarios y admins</a>
                </li>
                <li class="nav-item mt-4">
                    <a href="#" onclick="cerrarSesion(event)" class="nav-link text-danger">
                        <i class="fa-solid fa-right-from-bracket me-2"></i> Cerrar Sesión
                    </a>
                </li>
            </ul>
        </div>

        <!-- Contenido Principal -->
        <div class="col-md-10 p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="mb-0">Usuarios y admins</h2>
                    <small class="text-muted" id="contadorUsuarios">Cargando...</small>
                </div>
                <button class="btn btn-success" onclick="abrirFormularioUsuario()">
                    <i class="fa-solid fa-user-plus me-1"></i> Nuevo Usuario
                </button>
            </div>

            <!-- Contenedor donde se dibuja la lista/tabla de usuarios -->
            <div class="row g-3" id="listaUsuarios"></div>
        </div>
    </div>
</div>

<!-- Modal para Crear/Editar Usuario -->
<div class="modal fade" id="modalUsuario" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title" id="modal-titulo-usuario">Nuevo Usuario</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="formUsuario">
                    <input type="hidden" id="usuario-id">
                    <div class="mb-3">
                        <label class="form-label">Nombre completo</label>
                        <input id="usuario-nombre" class="form-control" required minlength="2">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Correo</label>
                        <input id="usuario-email" type="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña <small class="text-muted" id="pass-hint"></small></label>
                        <input id="usuario-password" type="password" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Teléfono (opcional)</label>
                        <input id="usuario-telefono" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Rol</label>
                        <!-- Las opciones se generan dinámicamente según la sesión en usuarios.js -->
                        <select id="usuario-rol" class="form-select" onchange="cambioRolUsuario()"></select>
                    </div>
                    <div class="mb-3" id="campo-complejo-usuario">
                        <label class="form-label">Complejo asignado</label>
                        <select id="usuario-complejo" class="form-select"></select>
                        <div class="form-text">Este admin podrá gestionar SOLO este complejo.</div>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Guardar</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Scripts al final en el orden correcto -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="usuarios.js"></script>
</body>
</html>
