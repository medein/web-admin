<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elige un complejo - Admin Canchas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #10b981, #059669);
            min-height: 100vh;
        }
        .card-complejo {
            border: none;
            border-radius: 14px;
            transition: transform .15s, box-shadow .15s;
            cursor: pointer;
        }
        .card-complejo:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,.15);
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="text-center text-white mb-5">
        <h1 class="fw-bold"><i class="fa-solid fa-futbol me-2"></i>Admin Canchas</h1>
        <p class="lead mb-1">Elige un complejo para administrar</p>
        <small>Sesión: <span id="usuarioSesion">...</span></small>
    </div>

    <div class="row g-3" id="listaComplejos"></div>

    <div class="text-center mt-5">
        <a href="#" onclick="cerrarSesion(event)" class="text-white">
            <i class="fa-solid fa-right-from-bracket me-1"></i> Cerrar Sesión
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
    async function cargarComplejosSelector() {
        const el = document.getElementById('listaComplejos');
        const nombre = localStorage.getItem('admin_nombre') || 'Administrador';
        document.getElementById('usuarioSesion').innerText = nombre;

        try {
            const res = await apiFetch('/complejos');
            if (!res.ok) {
                el.innerHTML = `<div class="col-12 text-white text-center">No se pudieron cargar los complejos.</div>`;
                return;
            }
            const complejos = await res.json();
            if (!complejos.length) {
                el.innerHTML = `<div class="col-12 text-white text-center">No hay complejos registrados aún.</div>`;
                return;
            }
            el.innerHTML = complejos.map(c => `
                <div class="col-md-6 col-lg-4">
                    <div class="card card-complejo h-100" onclick="elegirComplejo(${c.id}, '${escapar(c.nombre).replace(/'/g, "&#39;")}')">
                        <div class="card-body">
                            <h5 class="fw-bold mb-1">${escapar(c.nombre)}</h5>
                            <p class="text-muted small mb-3">${escapar(c.direccion || 'Sin dirección')}</p>
                            <span class="badge bg-light text-dark me-1">${c.total_canchas ?? 0} canchas</span>
                            ${c.horario_apertura && c.horario_cierre
                                ? `<span class="badge bg-light text-dark">${c.horario_apertura} - ${c.horario_cierre}</span>`
                                : ''}
                        </div>
                    </div>
                </div>
            `).join('');
        } catch (e) {
            console.error('Error:', e);
            el.innerHTML = `<div class="col-12 text-white text-center">Error al cargar.</div>`;
        }
    }

    function elegirComplejo(id, nombre) {
        localStorage.setItem('admin_complejo_id', String(id));
        localStorage.setItem('admin_complejo_nombre', nombre);
        window.location.href = 'index.html';
    }

    document.addEventListener('DOMContentLoaded', () => {
        if (!localStorage.getItem('admin_token')) {
            window.location.href = 'login.html';
            return;
        }
        cargarComplejosSelector();
    });
</script>
</body>
</html>
